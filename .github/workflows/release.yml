name: Release

# Push a tag `vX.Y.Z` (matching Cargo.toml) to build and publish a release
# laid out exactly like earlier ones: four tarballs (cxcap + install.sh +
# skill/), SHA256SUMS.txt, manifest.json (read by `cxcap update`) and
# install.sh. Linux builds target glibc 2.28 via cargo-zigbuild, the same
# floor as 1.0.2. A pull request touching this file builds everything but
# publishes nothing.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, zig: false, smoke: true }
          - { os: macos-latest, target: x86_64-apple-darwin, zig: false, smoke: false }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zig: true, smoke: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, zig: true, smoke: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Version
        id: v
        shell: bash
        run: |
          v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "tag ${GITHUB_REF#refs/tags/} does not match Cargo.toml version $v" >&2; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build (zig, glibc 2.28)
        if: matrix.zig
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
          cargo zigbuild --release --locked --target ${{ matrix.target }}.2.28
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="cxcap-${{ steps.v.outputs.version }}-${{ matrix.target }}"
          mkdir -p "stage/skill/cxcap-development" dist
          cp "target/${{ matrix.target }}/release/cxcap" stage/
          cp install.sh stage/
          cp skill/cxcap-development/SKILL.md stage/skill/cxcap-development/
          tar czf "dist/$name.tar.gz" -C stage cxcap install.sh skill
          tar tzf "dist/$name.tar.gz"
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          out=$(stage/cxcap --version)
          echo "$out"
          [[ "$out" == *"${{ steps.v.outputs.version }}"* ]]
          CXCAP_NO_UPDATE_CHECK=1 stage/cxcap audit . > /dev/null
      - name: glibc floor
        if: matrix.zig
        run: |
          max=$(strings stage/cxcap | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol: $max"
          [ "$(printf '%s\nGLIBC_2.28\n' "$max" | sort -V | tail -1)" = "GLIBC_2.28" ]
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and manifest
        run: |
          v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          cd dist
          targets="aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu"
          : > SHA256SUMS.txt
          for t in $targets; do sha256sum "cxcap-$v-$t.tar.gz" >> SHA256SUMS.txt; done
          V="$v" TARGETS="$targets" python3 - <<'PY'
          import json, os
          v, sums = os.environ["V"], dict(l.split()[::-1] for l in open("SHA256SUMS.txt"))
          assets = [{"name": n, "url": f"https://github.com/moonlettai/cxcap/releases/download/v{v}/{n}",
                     "digest": "sha256:" + sums[n]}
                    for n in (f"cxcap-{v}-{t}.tar.gz" for t in os.environ["TARGETS"].split())]
          json.dump({"schema": 1, "releases": [{"version": v, "assets": assets}]}, open("manifest.json", "w"), indent=2)
          PY
          cp ../install.sh .
          cat SHA256SUMS.txt manifest.json
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          notes=".github/release-notes/$tag.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$tag" --title "CXCAP ${tag#v}" --notes-file "$notes" --verify-tag \
            dist/*.tar.gz dist/SHA256SUMS.txt dist/manifest.json dist/install.sh
