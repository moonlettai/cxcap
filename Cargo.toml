[package]
name = "cxcap"
version = "0.12.0"
edition = "2021"
description = "Local software complexity analysis for understanding change exposure before complexity compounds"
license = "MIT"
keywords = ["complexity", "static-analysis", "cli"]

[[bin]]
name = "cxcap"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
tree-sitter = "0.27.0"
tree-sitter-python = "0.25.0"
regex = "1.13.1"
md5 = "0.8.1"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
self_update = { version = "1.3.0", default-features = false, features = ["manifest", "archive-tar", "compression-tar-gz", "checksums", "ureq", "rustls"] }
dirs = "7.0.0"
semver = "1.0.28"
sha2 = "0.11.0"
